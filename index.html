<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SYSTEM ERROR : UNKNOWN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="game">

    <!-- =========================================
         WORLD
    ========================================== -->

    <div id="world">

        <!-- =====================================
             INTRO AREA
        ====================================== -->

        <section id="intro-area">

            <div class="intro-fade"></div>

            <div class="intro-title">
                CONNECTION LOST
            </div>

            <div class="intro-subtitle">
                RECONNECTING...
            </div>

            <!-- 오른쪽으로 이어지는 부드러운 빛 -->
            <div class="light-path"></div>

            <div class="light-core"></div>

            <div class="system-access">

                <div class="access-frame"></div>

                <div class="access-core"></div>

                <div class="access-text">
                    SYSTEM ACCESS
                </div>

            </div>

        </section>


        <!-- =====================================
             FILE SYSTEM
        ====================================== -->

        <section id="system-area">

            <div class="system-header">

                <span>
                    LOCAL SYSTEM
                </span>

                <span class="system-status-small">
                    ONLINE
                </span>

            </div>


            <!-- =================================
                 DOCUMENTS
            ================================== -->

            <div
                class="system-object"
                style="left: 170px; top: 180px;"
                data-type="documents"
            >

                <div class="folder-icon"></div>

                <span>
                    Documents
                </span>

            </div>


            <!-- =================================
                 SENSORS
            ================================== -->

            <div
                class="system-object"
                style="left: 450px; top: 180px;"
                data-type="sensors"
            >

                <div class="folder-icon"></div>

                <span>
                    Sensors
                </span>

            </div>


            <!-- =================================
                 CONTROL
            ================================== -->

            <div
                class="system-object"
                style="left: 730px; top: 180px;"
                data-type="control"
            >

                <div class="folder-icon"></div>

                <span>
                    Control
                </span>

            </div>


            <!-- =================================
                 POWER
            ================================== -->

            <div
                class="system-object"
                style="left: 1010px; top: 180px;"
                data-type="power"
            >

                <div class="folder-icon"></div>

                <span>
                    Power
                </span>

            </div>


            <!-- =================================
                 DIAGNOSTICS
            ================================== -->

            <div
                class="system-object"
                style="left: 300px; top: 420px;"
                data-type="diagnostics"
            >

                <div class="folder-icon"></div>

                <span>
                    Diagnostics
                </span>

            </div>


            <!-- =================================
                 ERROR LOG
            ================================== -->

            <div
                class="system-object"
                style="left: 610px; top: 430px;"
                data-type="error"
            >

                <div class="document-icon">

                    <div class="document-lines">
                        <i></i>
                        <i></i>
                        <i></i>
                    </div>

                    <div class="extension">
                        txt
                    </div>

                </div>

                <span>
                    ERROR_LOG.txt
                </span>

            </div>


            <!-- =================================
                 EXIT
            ================================== -->

            <div
                id="exit-door"
                style="left: 1100px; top: 520px;"
                data-type="exit"
            >

                <div class="exit-symbol">
                    EXIT
                </div>

                <span>
                    EXIT
                </span>

            </div>


            <!-- =================================
                 TRASH
            ================================== -->

            <div
                class="system-object"
                style="left: 900px; top: 470px;"
                data-type="trash"
            >

                <div class="trash">

                    <div class="trash-handle"></div>

                    <div class="trash-lid"></div>

                    <div class="trash-body">
                        <i></i>
                        <i></i>
                        <i></i>
                    </div>

                </div>

                <span>
                    Trash
                </span>

            </div>


            <!-- =================================
                 HIDDEN MACHINE
            ================================== -->

            <div
                id="machine"
                style="left: 1170px; top: 250px;"
                data-type="machine"
            >

                <div class="machine-screen">
                    SYSTEM
                </div>

                <div class="machine-body">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <!-- =================================
                 PLAYER
            ================================== -->

            <div id="player">

                <div class="player-shadow"></div>

                <div class="player-head"></div>

                <div class="player-body"></div>

            </div>

        </section>

    </div>


    <!-- =========================================
         SYSTEM STATUS
    ========================================== -->

    <section id="system-status">

        <div class="status-title">
            SYS STATUS
        </div>

        <div class="status-row">

            <span>
                DIST.
            </span>

            <div class="gauge">
                <span
                    id="distance-gauge"
                ></span>
            </div>

            <strong id="distance-value">
                --cm
            </strong>

        </div>


        <div class="status-row">

            <span>
                TEMP.
            </span>

            <div class="gauge">
                <span
                    id="temperature-gauge"
                ></span>
            </div>

            <strong id="temperature-value">
                24°C
            </strong>

        </div>


        <div class="status-row">

            <span>
                HP
            </span>

            <div class="gauge">
                <span
                    id="hp-gauge"
                ></span>
            </div>

            <strong>
                100%
            </strong>

        </div>

    </section>


    <!-- =========================================
         DIALOGUE
    ========================================== -->

    <section id="dialogue">

        <div id="dialogue-text">
            SYSTEM READY.
        </div>

        <div id="dialogue-hint">
            SPACE · 조사 / 대화
        </div>

    </section>


    <!-- =========================================
         MODAL
    ========================================== -->

    <section id="modal">

        <div id="modal-window">

            <div id="modal-header">

                <span id="modal-title">
                    SYSTEM
                </span>

                <button id="modal-close">
                    ×
                </button>

            </div>


            <div id="modal-content">

            </div>

        </div>

    </section>


</main>


<script src="script.js"></script>

</body>
</html>
