<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100f20">
<title>REBOOT — 기억 복구 기록</title>
<link rel="stylesheet" href="./style.css?v=23">
</head>
<body>
<main id="game-wrap" aria-label="REBOOT 픽셀 어드벤처 게임">
  <canvas id="screen" width="320" height="180" aria-label="게임 화면"></canvas>
  <div id="facility-labels" aria-hidden="true"></div>
  <section id="memory-archive" class="hidden" aria-label="기억 아카이브"><header><div><strong>MEMORY ARCHIVE</strong><p id="memory-status">기억 복구 0 / 4</p></div><button id="memory-close" type="button">닫기 · M</button></header><div id="memory-list"></div><footer>시설 복구 기록은 이곳에 저장돼. M을 눌러 탐험으로 돌아가.</footer></section>
  <div id="hud" class="minimal-hud"><canvas id="hud-pixel" width="320" height="32" aria-label="스테이지와 배터리 상태"></canvas></div>
  <section id="dialogue" class="hidden" aria-live="polite">
    <div class="speaker"><span id="speaker">MICA</span><span id="dialogue-index">01 / 01</span></div>
    <p id="line"></p><canvas id="dialogue-pixel" width="288" height="42" aria-hidden="true"></canvas><div class="dialogue-hint"><span class="space-key" id="space-key">SPACE</span><span class="next-arrow">▶</span></div>
  </section>
  <div id="start-screen" aria-label="시작하려면 클릭하거나 SPACE를 누르세요"><canvas id="logo-pixel" width="112" height="30"></canvas></div>
  <div id="interaction-prompt" aria-live="polite"></div><div id="toast" class="hidden"><canvas id="toast-pixel" width="280" height="30" aria-label="상호작용 안내"></canvas></div>
  <canvas id="ending-animation" width="320" height="180" class="hidden" aria-label="코어 재가동 애니메이션"></canvas><section id="ending-screen" class="hidden" aria-label="게임 엔딩"><canvas id="ending-logo" width="112" height="30" aria-label="REBOOT"></canvas><div class="ending-credits"><p>임서연</p><p>022261@hafs.hs.kr</p></div></section>
</main>
<script src="./script.js?v=23"></script>
</body>
</html>
