<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ESCAPE: ENGINEERING LAB</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        <!-- 상단 게임 정보 UI -->
        <div id="hud">
            <div id="room-title">ROOM 1: SENSOR CALIBRATION LAB</div>
            <div id="progress">CORE RESTORED: <span id="cleared-count">0</span> / 3</div>
        </div>

        <!-- 게임 뷰포트 / 맵 화면 -->
        <div id="viewport">
            <div id="map">
                <!-- 플레이어 캐릭터 -->
                <div id="player"></div>

                <!-- ROOM 1: SENSOR LAB -->
                <div id="room-1" class="room-area active">
                    <div class="wall top"></div>
                    <div class="wall bottom"></div>
                    <div class="wall left"></div>
                    <!-- 상호작용 가능한 단말기들 -->
                    <div class="obj sensor-node" data-id="sensor1" style="left: 150px; top: 120px;">[센서 A]</div>
                    <div class="obj sensor-node" data-id="sensor2" style="left: 400px; top: 120px;">[센서 B]</div>
                    <div class="obj terminal" data-id="quiz-sensor" style="left: 275px; top: 320px;">🖥️ 센서 제어 콘솔</div>
                    <!-- 다음 방으로 향하는 문 -->
                    <div class="door locked" id="door-1" style="left: 720px; top: 200px;">GATE 1<br>(LOCKED)</div>
                </div>

                <!-- ROOM 2: POWER BAY -->
                <div id="room-2" class="room-area" style="left: 800px;">
                    <div class="wall top"></div>
                    <div class="wall bottom"></div>
                    <div class="obj power-node" data-id="power1" style="left: 150px; top: 120px;">[모터 가동부]</div>
                    <div class="obj power-node" data-id="power2" style="left: 400px; top: 120px;">[냉각 시스템]</div>
                    <div class="obj terminal" data-id="quiz-power" style="left: 275px; top: 320px;">⚡ 전력 배분 콘솔</div>
                    <div class="door locked" id="door-2" style="left: 720px; top: 200px;">GATE 2<br>(LOCKED)</div>
                </div>

                <!-- ROOM 3: CONTROL LAB -->
                <div id="room-3" class="room-area" style="left: 1600px;">
                    <div class="wall top"></div>
                    <div class="wall bottom"></div>
                    <div class="wall right"></div>
                    <div class="obj control-node" data-id="ctrl1" style="left: 150px; top: 120px;">[응답 곡선 A]</div>
                    <div class="obj control-node" data-id="ctrl2" style="left: 400px; top: 120px;">[응답 곡선 B]</div>
                    <div class="obj terminal" data-id="quiz-control" style="left: 275px; top: 320px;">🎛️ PID 튜닝 콘솔</div>
                    <div class="door exit-gate locked" id="door-exit" style="left: 650px; top: 300px;">MAIN EXIT</div>
                </div>
            </div>

            <!-- 상호작용 안내 말풍선 -->
            <div id="prompt-ui">[SPACE] 상호작용</div>
        </div>

        <!-- 퀴즈 팝업 모달 UI -->
        <div id="quiz-modal" class="hidden">
            <div class="modal-content">
                <h3 id="quiz-title">SYSTEM QUIZ</h3>
                <p id="quiz-desc">퀴즈 내용이 여기에 표시됩니다.</p>
                <div id="quiz-options"></div>
                <button id="close-quiz-btn">닫기 (ESC)</button>
            </div>
        </div>

        <!-- 엔딩 화면 -->
        <div id="ending-screen" class="hidden">
            <h1>SYSTEM REBOOT COMPLETE</h1>
            <p>모든 공학 시스템을 정상 복구하고 연구소를 탈출했습니다!</p>
            <button onclick="location.reload()">다시 시작하기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
