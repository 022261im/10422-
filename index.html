<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SYSTEM ERROR : UNKNOWN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="game">

    <!-- =========================================
         GAME WORLD
    ========================================== -->
    <div id="game-world">

        <!-- 화면 전체에 들어오는 빛 -->
        <div id="light-field"></div>

        <!-- 플레이어를 안내하는 빛의 회로 -->
        <div id="light-road">

            <div class="road-line road-main"></div>
            <div class="road-line road-branch"></div>

            <div class="road-node node-a"></div>
            <div class="road-node node-b"></div>
            <div class="road-node node-c"></div>
            <div class="road-node node-d"></div>

        </div>


        <!-- =====================================
             FILE SYSTEM AREA
        ====================================== -->

        <div id="file-space">

            <!-- Documents -->
            <div
                class="file-object"
                style="left: 1200px; top: 280px;"
                data-message="Documents 폴더다. 여러 파일이 저장되어 있다."
            >
                <div class="icon folder-icon">
                    <div class="folder-tab"></div>
                </div>

                <span>Documents</span>
            </div>


            <!-- System -->
            <div
                class="file-object"
                style="left: 1450px; top: 210px;"
                data-message="SYSTEM 폴더다. 접근 권한이 필요하다."
            >
                <div class="icon system-icon">
                    <div class="system-mark"></div>
                </div>

                <span>System</span>
            </div>


            <!-- ERROR LOG -->
            <div
                class="file-object"
                style="left: 1710px; top: 310px;"
                data-message="ERROR_LOG.txt 파일이다. 최근 시스템 오류가 기록되어 있다."
            >
                <div class="icon document-icon">

                    <div class="document-fold"></div>

                    <div class="document-lines">
                        <i></i>
                        <i></i>
                        <i></i>
                    </div>

                </div>

                <span>ERROR_LOG.txt</span>
            </div>


            <!-- UNKNOWN -->
            <div
                class="file-object"
                style="left: 1450px; top: 500px;"
                data-message="파일명이 UNKNOWN으로 표시되어 있다."
            >
                <div class="icon unknown-icon">
                    ?
                </div>

                <span>UNKNOWN</span>
            </div>


            <!-- TRASH -->
            <div
                class="file-object trash-object"
                style="left: 1860px; top: 540px;"
                data-message="휴지통이다. 현재 비어 있다."
            >

                <div class="trash-can">

                    <div class="trash-lid"></div>

                    <div class="trash-body">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                </div>

                <span>Trash</span>

            </div>

        </div>


        <!-- SYSTEM ACCESS -->
        <div id="system-gate">

            <div class="gate-ring"></div>

            <div class="gate-core"></div>

            <div class="gate-text">
                SYSTEM
            </div>

        </div>


        <!-- =====================================
             PLAYER
        ====================================== -->

        <div id="player">

            <div class="player-head"></div>

            <div class="player-body"></div>

        </div>

    </div>


    <!-- =========================================
         SYSTEM STATUS
    ========================================== -->

    <section id="system-status">

        <div class="status-title">
            SYS STATUS
        </div>

        <div class="status-line">

            <span>DIST.</span>

            <div class="gauge">
                <span
                    class="filled"
                    id="distance-gauge"
                ></span>
            </div>

            <span id="distance-value">
                --cm
            </span>

        </div>


        <div class="status-line">

            <span>TEMP.</span>

            <div class="gauge">

                <span
                    class="filled"
                    id="temperature-gauge"
                ></span>

            </div>

            <span id="temperature-value">
                24°C
            </span>

        </div>


        <div class="status-line">

            <span>HP</span>

            <div class="gauge">

                <span
                    class="filled"
                    id="hp-gauge"
                ></span>

            </div>

            <span id="hp-value">
                100%
            </span>

        </div>

    </section>


    <!-- =========================================
         DIALOGUE
    ========================================== -->

    <section id="dialogue">

        <div id="dialogue-text">
            SYSTEM READY.
        </div>

        <div id="dialogue-hint">
            SPACE · 조사 / 대화
        </div>

    </section>


</main>

<script src="script.js"></script>

</body>
</html>
