<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SYSTEM ERROR : UNKNOWN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="game">

    <!-- =========================================
         GAME WORLD
    ========================================== -->

    <div id="game-world">

        <!-- 빛의 길 -->
        <div id="light-path">

            <div class="path-segment path-1"></div>
            <div class="path-segment path-2"></div>
            <div class="path-segment path-3"></div>
            <div class="path-segment path-4"></div>
            <div class="path-node node-1"></div>
            <div class="path-node node-2"></div>
            <div class="path-node node-3"></div>

        </div>


        <!-- 다른 길처럼 보이는 가짜 경로 -->
        <div id="wrong-path"></div>


        <!-- 플레이어 -->
        <div id="player">

            <div class="player-head"></div>
            <div class="player-body"></div>

        </div>


        <!-- 파일 시스템 공간 -->
        <div id="file-space">

            <div
                class="file-object"
                style="left: 22%; top: 30%;"
                data-message="Documents 폴더. 열어볼 수 있다."
            >
                <div class="file-icon folder-icon"></div>
                <span>Documents</span>
            </div>


            <div
                class="file-object"
                style="left: 42%; top: 22%;"
                data-message="SYSTEM 폴더. 접근 권한이 필요하다."
            >
                <div class="file-icon system-icon"></div>
                <span>System</span>
            </div>


            <div
                class="file-object"
                style="left: 69%; top: 34%;"
                data-message="ERROR_LOG.txt 파일이 있다."
            >
                <div class="file-icon text-icon"></div>
                <span>ERROR_LOG.txt</span>
            </div>


            <div
                class="file-object"
                style="left: 55%; top: 67%;"
                data-message="알 수 없는 파일이다. 이름이 UNKNOWN으로 표시되어 있다."
            >
                <div class="file-icon unknown-icon"></div>
                <span>UNKNOWN</span>
            </div>


            <div
                class="file-object"
                style="left: 80%; top: 73%;"
                data-message="휴지통. 비어 있다."
            >
                <div class="file-icon trash-icon"></div>
                <span>TRASH</span>
            </div>

        </div>


        <!-- 파일 공간 진입 오브젝트 -->
        <div id="system-gate">
            <div class="gate-line"></div>
            <div class="gate-core"></div>
            <div class="gate-label">SYSTEM</div>
        </div>

    </div>


    <!-- =========================================
         SYSTEM STATUS
    ========================================== -->

    <section id="system-status">

        <div class="status-title">
            SYS STATUS
        </div>

        <div class="status-line">

            <span>DIST.</span>

            <div class="gauge">
                <span
                    class="filled"
                    id="distance-gauge"
                ></span>
            </div>

            <span id="distance-value">--cm</span>

        </div>


        <div class="status-line">

            <span>TEMP.</span>

            <div class="gauge">
                <span
                    class="filled"
                    id="temperature-gauge"
                ></span>
            </div>

            <span id="temperature-value">24°C</span>

        </div>


        <div class="status-line">

            <span>HP</span>

            <div class="gauge">
                <span
                    class="filled"
                    id="hp-gauge"
                ></span>
            </div>

            <span id="hp-value">100%</span>

        </div>

    </section>


    <!-- =========================================
         DIALOGUE
    ========================================== -->

    <section id="dialogue">

        <div id="dialogue-text">
            SYSTEM READY.
        </div>

        <div id="dialogue-hint">
            SPACE · 조사 / 대화
        </div>

    </section>


</main>

<script src="script.js"></script>

</body>
</html>
