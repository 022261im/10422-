<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ERROR : UNKNOWN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="game">

    <div id="world">

        <!-- =================================
             INTRO WORLD
        ================================== -->

        <section id="intro-area">

            <div class="zone-label">SECTOR 00</div>

            <!-- 바닥 격자 -->
            <div class="floor-grid"></div>

            <!-- 데이터 포인트 -->
            <div class="data-point p1">
                <span>001</span>
            </div>

            <div class="data-point p2">
                <span>014</span>
            </div>

            <div class="data-point p3">
                <span>029</span>
            </div>

            <div class="data-point p4">
                <span>047</span>
            </div>

            <div class="data-point p5">
                <span>063</span>
            </div>

            <!-- 데이터 선 -->
            <div class="data-line line1"></div>
            <div class="data-line line2"></div>
            <div class="data-line line3"></div>
            <div class="data-line line4"></div>

            <!-- 떠 있는 시스템 문자 -->
            <div class="floating-code code1">SYS_014</div>
            <div class="floating-code code2">ERR_029</div>
            <div class="floating-code code3">---</div>

            <!-- 방향 표시 -->
            <div class="direction-marker">
                →
            </div>

            <div class="direction-text">
                DATA CONTINUES
            </div>


            <!-- 진입 장치 -->
            <div id="access-point">

                <div class="access-frame"></div>

                <div class="access-screen">
                    SYSTEM
                </div>

                <div class="access-text">
                    ACCESS
                </div>

            </div>

        </section>


        <!-- =================================
             FILE SYSTEM
        ================================== -->

        <section id="file-area">

            <div class="file-zone-title">
                LOCAL SYSTEM
            </div>

            <!-- Documents -->
            <div
                class="file-object"
                style="left: 250px; top: 260px;"
                data-message="Documents 폴더다. 여러 문서가 저장되어 있다."
            >
                <div class="folder-icon">
                    <div class="folder-tab"></div>
                </div>

                <span>Documents</span>
            </div>


            <!-- System -->
            <div
                class="file-object"
                style="left: 550px; top: 180px;"
                data-message="SYSTEM 폴더다. 접근 권한이 필요하다."
            >
                <div class="system-icon">
                    <div></div>
                </div>

                <span>System</span>
            </div>


            <!-- ERROR LOG -->
            <div
                class="file-object"
                style="left: 850px; top: 290px;"
                data-message="ERROR_LOG.txt 파일이다. 최근 시스템 오류가 기록되어 있다."
            >
                <div class="document-icon">

                    <div class="paper-fold"></div>

                    <div class="paper-lines">
                        <i></i>
                        <i></i>
                        <i></i>
                    </div>

                </div>

                <span>ERROR_LOG.txt</span>
            </div>


            <!-- UNKNOWN -->
            <div
                class="file-object"
                style="left: 560px; top: 480px;"
                data-message="파일명이 UNKNOWN으로 표시되어 있다."
            >
                <div class="unknown-icon">
                    ?
                </div>

                <span>UNKNOWN</span>
            </div>


            <!-- TRASH -->
            <div
                class="file-object"
                style="left: 1050px; top: 500px;"
                data-message="휴지통이다. 비어 있다."
            >
                <div class="trash">

                    <div class="trash-handle"></div>
                    <div class="trash-lid"></div>

                    <div class="trash-body">
                        <i></i>
                        <i></i>
                        <i></i>
                    </div>

                </div>

                <span>Trash</span>
            </div>

        </section>


        <!-- =================================
             PLAYER
        ================================== -->

        <div id="player">

            <div class="player-head"></div>
            <div class="player-body"></div>
            <div class="player-shadow"></div>

        </div>

    </div>


    <!-- =================================
         STATUS
    ================================== -->

    <section id="system-status">

        <div class="status-title">
            SYS STATUS
        </div>

        <div class="status-line">
            <span>DIST.</span>

            <div class="gauge">
                <span id="distance-gauge"></span>
            </div>

            <strong id="distance-value">
                0px
            </strong>
        </div>

        <div class="status-line">
            <span>TEMP.</span>

            <div class="gauge">
                <span id="temperature-gauge"></span>
            </div>

            <strong>
                24°C
            </strong>
        </div>

        <div class="status-line">
            <span>HP</span>

            <div class="gauge">
                <span id="hp-gauge"></span>
            </div>

            <strong>
                100%
            </strong>
        </div>

    </section>


    <!-- =================================
         DIALOGUE
    ================================== -->

    <section id="dialogue">

        <div id="dialogue-text">
            SYSTEM READY.
        </div>

        <div id="dialogue-hint">
            SPACE · 조사 / 대화
        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
