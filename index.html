<!doctype html>
<html lang="ko">
<head>

<body>
<main id="game-wrap" aria-label="REBOOT 픽셀 어드벤처 게임">

  <div id="hud" class="minimal-hud"></div>
  <section id="dialogue" class="hidden" aria-live="polite">

  <div id="start-screen" aria-label="시작하려면 클릭하거나 SPACE를 누르세요"><div class="start-title">REBOOT</div><div class="start-subtitle">SYSTEM RESTORE</div></div>
  <div id="toast" class="hidden"></div>
  <section id="ending-screen" class="hidden" aria-label="게임 엔딩"><canvas id="ending-scene" width="320" height="88"></canvas><div class="ending-text"><h2>REBOOT</h2><h3>CORE RESTORED</h3><p>기억과 기력을 되찾았다.</p><p class="creator">제작자 임서연 / 022261@hafs.hs.kr</p></div></section>
