<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Explorer - Sensor Repair</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">
        <!-- 상단 헤더 UI -->
        <div id="status-bar">
            <span>[SECTOR 01: LOGIC BUS]</span>
            <span id="quest-text">Mission: 조사 가능한 센서 노드를 찾으세요.</span>
        </div>

        <!-- 메인 탐험 캔버스 -->
        <canvas id="gameCanvas" width="640" height="480"></canvas>

        <!-- 사물 조사 / 모달 UI (E 키 누를 때 팝업) -->
        <div id="modal-overlay" class="hidden">
            <div id="terminal-modal" class="pixel-modal">
                <div class="modal-header">
                    <span id="modal-title">[SENS_NODE_01 INTERFACE]</span>
                    <button id="btn-close" onclick="closeModal()">X</button>
                </div>
                <div class="modal-body">
                    <!-- 스토리 / 단서 텍스트 -->
                    <div id="dialogue-box">
                        <p id="dialogue-text">센서 노드 S-01에 접속 중... 온도가 비정상 측정되고 있습니다.</p>
                    </div>

                    <!-- 공학적 센서 보정 퍼즐 패널 -->
                    <div id="puzzle-panel">
                        <hr class="pixel-hr">
                        <h4>🔧 SENSOR CALIBRATION (신호 보정)</h4>
                        <p class="puzzle-desc">목표 출력값(Target): <strong id="target-val" style="color:#00ff00;">50.0 °C</strong></p>
                        <p class="puzzle-desc">현재 측정값(Current): <strong id="current-val" style="color:#ff3333;">0.0 °C</strong></p>

                        <div class="control-group">
                            <label>GAIN (증폭도): <span id="gain-val">1.0</span></label>
                            <input type="range" id="slider-gain" min="0.1" max="3.0" step="0.1" value="1.0">
                        </div>

                        <div class="control-group">
                            <label>OFFSET (영점 보정): <span id="offset-val">0</span></label>
                            <input type="range" id="slider-offset" min="-30" max="30" step="1" value="0">
                        </div>

                        <button id="btn-calibrate" class="pixel-btn" onclick="checkCalibration()">⚡ 교정 신호 전송</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 조작 안내 -->
        <div id="controls-hint">
            이동: [WASD / 방향키] | 사물 조사: [E 또는 Space]
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
