<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngineOS v1.0.4 - Debugger</title>
    <link rel="stylesheet" href="style.css">
    <!-- 레트로 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div id="desktop">
        <!-- 1. 메인 시스템 모니터 창 -->
        <div class="window" id="win-status" style="top: 20px; left: 20px; width: 320px;">
            <div class="title-bar">
                <span>[SYS_MONITOR.EXE]</span>
                <span class="win-btn">_</span>
            </div>
            <div class="window-body">
                <div class="stat-group">
                    <label>CORE INTEGRITY (HP):</label>
                    <div class="progress-bar"><div id="hp-bar" class="fill hp" style="width: 100%;"></div></div>
                </div>
                <div class="stat-group">
                    <label>SYSTEM TEMP (HEAT):</label>
                    <div class="progress-bar"><div id="heat-bar" class="fill heat" style="width: 30%;"></div></div>
                    <span id="temp-text" class="stat-val">30°C</span>
                </div>
                <div class="stat-group">
                    <label>POWER GRID (WATT):</label>
                    <div class="progress-bar"><div id="power-bar" class="fill power" style="width: 80%;"></div></div>
                    <span id="power-text" class="stat-val">80W / 100W</span>
                </div>
                
                <div class="btn-group">
                    <button id="btn-cool" class="pixel-btn">🌀 COOLING FLUSH</button>
                    <button id="btn-overclock" class="pixel-btn">⚡ OVERCLOCK (OFF)</button>
                </div>
            </div>
        </div>

        <!-- 2. 회로 & 모듈 관리 창 -->
        <div class="window" id="win-circuit" style="top: 20px; left: 360px; width: 300px;">
            <div class="title-bar">
                <span>[CIRCUIT_BOARD.SLOT]</span>
                <span class="win-btn">_</span>
            </div>
            <div class="window-body">
                <p class="guide-text">장착 모듈 클릭 시 토글:</p>
                <div class="module-grid">
                    <div class="module active" id="mod-fan" onclick="toggleModule('fan')">
                        <div class="mod-icon">❄️</div>
                        <div class="mod-name">Aux Cooling</div>
                    </div>
                    <div class="module active" id="mod-regulator" onclick="toggleModule('regulator')">
                        <div class="mod-icon">🔋</div>
                        <div class="mod-name">Vol. Regulator</div>
                    </div>
                    <div class="module" id="mod-filter" onclick="toggleModule('filter')">
                        <div class="mod-icon">🛡️</div>
                        <div class="mod-name">Noise Filter</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 터미널 이벤트 로그 창 -->
        <div class="window" id="win-log" style="top: 280px; left: 20px; width: 640px; height: 180px;">
            <div class="title-bar">
                <span>[TERMINAL_LOG]</span>
                <span class="win-btn">_</span>
            </div>
            <div class="window-body">
                <div id="log-output" class="console">
                    > System Kernel Initialized...<br>
                    > EngineOS Monitoring Active...<br>
                    > Warning: Anomalies detected on Grid B!
                </div>
            </div>
        </div>
    </div>

    <!-- 하단 작업표시줄 -->
    <div id="taskbar">
        <button class="start-btn">🕹️ START</button>
        <div class="task-item">EngineOS v1.0.4</div>
        <div id="clock">00:00:00</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
