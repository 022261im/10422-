<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SYSTEM ERROR : UNKNOWN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="game">

    <!-- =================================
         WORLD
    ================================== -->

    <div id="world">

        <!-- =================================
             INTRO AREA
        ================================== -->

        <section id="intro-area">

            <!-- 전체 공간의 미세한 안개 -->
            <div class="ambient-fade"></div>

            <!-- 오른쪽으로 이어지는 빛 -->
            <div class="light-path"></div>

            <!-- 빛의 중심 -->
            <div class="light-core"></div>

            <!-- SYSTEM -->
            <div id="access-point">

                <div class="access-ring"></div>

                <div class="access-core"></div>

                <div class="access-label">
                    SYSTEM
                </div>

            </div>

        </section>


        <!-- =================================
             FILE SYSTEM AREA
        ================================== -->

        <section id="file-area">

            <div class="file-area-title">
                LOCAL SYSTEM
            </div>


            <!-- Documents -->
            <div
                class="file-object"
                style="left: 220px; top: 250px;"
                data-message="Documents 폴더다. 여러 파일이 저장되어 있다."
            >

                <div class="folder-icon">
                    <div class="folder-tab"></div>
                </div>

                <span>Documents</span>

            </div>


            <!-- Pictures -->
            <div
                class="file-object"
                style="left: 470px; top: 390px;"
                data-message="이미지 파일들이 저장된 폴더다."
            >

                <div class="folder-icon">
                    <div class="folder-tab"></div>
                </div>

                <span>Pictures</span>

            </div>


            <!-- SYSTEM -->
            <div
                class="file-object"
                style="left: 520px; top: 190px;"
                data-message="SYSTEM 폴더다. 접근 권한이 필요하다."
            >

                <div class="system-icon">

                    <div class="system-symbol"></div>

                </div>

                <span>System</span>

            </div>


            <!-- ERROR LOG -->
            <div
                class="file-object"
                style="left: 770px; top: 280px;"
                data-message="ERROR_LOG.txt 파일이다. 최근 시스템 오류가 기록되어 있다."
            >

                <div class="document-icon">

                    <div class="document-corner"></div>

                    <div class="document-lines">
                        <i></i>
                        <i></i>
                        <i></i>
                    </div>

                    <div class="extension-tag">
                        txt
                    </div>

                </div>

                <span>ERROR_LOG.txt</span>

            </div>


            <!-- IMAGE FILE -->
            <div
                class="file-object"
                style="left: 930px; top: 430px;"
                data-message="IMAGE_001.jpg 파일이다."
            >

                <div class="document-icon">

                    <div class="document-corner"></div>

                    <div class="document-lines">
                        <i></i>
                        <i></i>
                        <i></i>
                    </div>

                    <div class="extension-tag">
                        jpg
                    </div>

                </div>

                <span>IMAGE_001.jpg</span>

            </div>


            <!-- UNKNOWN -->
            <div
                class="file-object"
                style="left: 690px; top: 520px;"
                data-message="파일명이 UNKNOWN으로 표시되어 있다."
            >

                <div class="document-icon unknown-file">

                    <div class="question-mark">
                        ?
                    </div>

                </div>

                <span>UNKNOWN</span>

            </div>


            <!-- TRASH -->
            <div
                class="file-object"
                style="left: 1120px; top: 520px;"
                data-message="휴지통이다. 현재 비어 있다."
            >

                <div class="trash">

                    <div class="trash-handle"></div>

                    <div class="trash-lid"></div>

                    <div class="trash-body">

                        <i></i>
                        <i></i>
                        <i></i>

                    </div>

                </div>

                <span>Trash</span>

            </div>

        </section>


        <!-- =================================
             PLAYER
        ================================== -->

        <div id="player">

            <div class="player-shadow"></div>

            <div class="player-head"></div>

            <div class="player-body"></div>

        </div>

    </div>


    <!-- =================================
         SYSTEM STATUS
    ================================== -->

    <section id="system-status">

        <div class="status-title">
            SYS STATUS
        </div>

        <div class="status-line">

            <span>DIST.</span>

            <div class="gauge">
                <span id="distance-gauge"></span>
            </div>

            <strong id="distance-value">
                --cm
            </strong>

        </div>


        <div class="status-line">

            <span>TEMP.</span>

            <div class="gauge">
                <span id="temperature-gauge"></span>
            </div>

            <strong>
                24°C
            </strong>

        </div>


        <div class="status-line">

            <span>HP</span>

            <div class="gauge">
                <span id="hp-gauge"></span>
            </div>

            <strong>
                100%
            </strong>

        </div>

    </section>


    <!-- =================================
         DIALOGUE
    ================================== -->

    <section id="dialogue">

        <div id="dialogue-text">
            SYSTEM READY.
        </div>

        <div id="dialogue-hint">
            SPACE · 조사 / 대화
        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
